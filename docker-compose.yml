services:

  blue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blue-app
    ports:
      - "5001:80"
    restart: unless-stopped
    networks:
      - bluegreen-network

  green:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: green-app
    ports:
      - "5002:80"
    restart: unless-stopped
    networks:
      - bluegreen-network

  nginx:
    image: nginx:alpine
    container_name: blue-green-nginx
    ports:
      - "5000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - blue
      - green
    restart: unless-stopped
    networks:
      - bluegreen-network

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins-server
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - C:/Users/Admin/jenkins-data/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - bluegreen-network

networks:
  bluegreen-network:
    driver: bridge